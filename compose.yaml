services:
  refridge:
    build: .
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gemini-2.5-flash}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "8787:8787"
    volumes:
      - fridgeful-data:/data
    restart: unless-stopped
volumes:
  fridgeful-data:
